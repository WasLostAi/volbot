name: Block Unwanted Dependencies

on:
  pull_request:
    paths:
      - 'package*.json'
      - 'yarn.lock'

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    name: Check for unwanted dependencies
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check for unwanted dependencies
        run: |
          echo "🔍 Checking for unwanted npm dependencies..."
          
          # List of unwanted dependencies with exact versions
          UNWANTED_DEPS=(
            "chalk@5.6.1"
            "debug@4.4.2"
            "ansi-styles@6.2.2"
            "supports-color@10.2.1"
            "strip-ansi@7.1.1"
            "ansi-regex@6.2.1"
            "wrap-ansi@9.0.1"
            "color-convert@3.1.1"
            "color-name@2.0.1"
            "is-arrayish@0.3.3"
            "slice-ansi@7.1.1"
            "color@5.0.1"
            "color-string@2.1.1"
            "simple-swizzle@0.2.3"
            "supports-hyperlinks@4.1.1"
            "has-ansi@6.0.1"
            "chalk-template@1.1.1"
            "backslash@0.2.1"
          )
          
          # Files to check
          FILES_TO_CHECK=()
          if [ -f "package.json" ]; then
            FILES_TO_CHECK+=("package.json")
          fi
          if [ -f "package-lock.json" ]; then
            FILES_TO_CHECK+=("package-lock.json")
          fi
          if [ -f "yarn.lock" ]; then
            FILES_TO_CHECK+=("yarn.lock")
          fi
          
          FOUND_UNWANTED=false
          MATCHING_LINES=()
          
          # Check each file for unwanted dependencies
          for file in "${FILES_TO_CHECK[@]}"; do
            echo "📋 Checking $file..."
            
            for dep in "${UNWANTED_DEPS[@]}"; do
              # Use grep to search for the exact dependency version
              if grep -n "$dep" "$file" 2>/dev/null; then
                echo "❌ Found unwanted dependency: $dep in $file"
                FOUND_UNWANTED=true
                # Store matching lines for detailed output
                while IFS= read -r line; do
                  MATCHING_LINES+=("$file: $line")
                done < <(grep -n "$dep" "$file" 2>/dev/null)
              fi
            done
          done
          
          # If unwanted dependencies found, fail the workflow
          if [ "$FOUND_UNWANTED" = true ]; then
            echo ""
            echo "🚫 WORKFLOW FAILED: Unwanted dependencies detected!"
            echo ""
            echo "The following unwanted dependencies were found:"
            printf '%s\n' "${MATCHING_LINES[@]}"
            echo ""
            echo "Please remove these dependencies or update them to different versions."
            echo "Blocked dependencies and versions:"
            printf '  - %s\n' "${UNWANTED_DEPS[@]}"
            exit 1
          else
            echo "✅ No unwanted dependencies found. All checks passed!"
          fi